<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Макет: одна колонка до 560px, фиксированная нижняя панель с тремя вкладками.
     Палитра: холодный серо-голубой нейтральный фон и один синий акцент; золотой только для рекордов. */
  :root {
    --bg: #ffffff;
    --fg: #14161a;
    --muted: #5f6672;
    --card: #f1f3f6;
    --chip: #e3e6eb;
    --line: rgba(95, 102, 114, .28);
    --accent: #1a6fb8;
    --on-accent: #ffffff;
    --link: #17609f;
    --danger: #c4281c;
    --badge-bg: #fff1cc;
    --badge-fg: #7a4a00;
    --scrim: rgba(0, 0, 0, .45);
    --font: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --disp: var(--font); --disp-w: 700; --disp-tf: none; --disp-ls: 0;
    --r-card: 14px; --r-btn: 12px; --r-day: 12px;
    --btn: var(--accent); --btn-fg: var(--on-accent); --btn-clip: none;
    --day-bg: var(--accent); --day-fg: var(--on-accent); --dot: var(--accent);
    --chk: var(--accent); --chk-fg: var(--on-accent); --chk-r: 50%;
    --excard: var(--card); --tile: var(--card); --input: var(--bg);
    --hero-bg: transparent; --hero-pad: 0px; --hero-fg: var(--fg);
  }
  :root[data-theme="dark"] {
    --bg: #101216; --fg: #eceff4; --muted: #a2a9b5; --card: #1a1d24; --chip: #2a2e38;
    --line: rgba(162, 169, 181, .28); --accent: #2a75c5; --on-accent: #ffffff; --link: #7db8f0;
    --danger: #ff7b72; --badge-bg: #4a3a0e; --badge-fg: #ffd88a; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  :root[data-theme="red"] {
    --bg: #170f10; --fg: #f6eceb; --muted: #b9a2a0; --card: #251719; --chip: #3a2326;
    --line: rgba(185, 162, 160, .28); --accent: #d32f2f; --on-accent: #ffffff; --link: #ff8a80;
    --danger: #ffab91; --badge-bg: #4a3a0e; --badge-fg: #ffd88a; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  :root[data-theme="blue"] {
    --bg: #0b1426; --fg: #e8eefb; --muted: #9fb0cc; --card: #14213b; --chip: #1f2f50;
    --line: rgba(159, 176, 204, .28); --accent: #2563c9; --on-accent: #ffffff; --link: #8fc1ff;
    --danger: #ff7b72; --badge-bg: #4a3a0e; --badge-fg: #ffd88a; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  :root[data-theme="contrast"] {
    --bg: #f3f3f1; --fg: #111111; --muted: #84847f; --card: #ffffff; --chip: #e6e6e3; --line: rgba(17,17,17,.14);
    --accent: #d92b2b; --on-accent: #ffffff; --link: #b81f1f; --danger: #b81f1f;
    --font: "Manrope", -apple-system, system-ui, sans-serif; --disp: "Barlow Condensed", "Arial Narrow", sans-serif; --disp-w: 800; --disp-tf: uppercase; --disp-ls: .01em;
    --r-card: 22px; --r-btn: 16px; --r-day: 14px;
    --btn: #111111; --btn-fg: #ffffff; --day-bg: #111111; --day-fg: #ffffff; --chk: #111111; --chk-fg: #ffffff;
    --tile: transparent; --input: #ffffff;
  }
  :root[data-theme="night"] {
    --bg: #09090a; --fg: #ffffff; --muted: #8d8d93; --card: #17171a; --chip: #26262b; --line: rgba(255,255,255,.12);
    --accent: #e03a3a; --on-accent: #ffffff; --link: #ff7a7a; --danger: #ff8a8a; --scrim: rgba(0,0,0,.65);
    --badge-bg: #4a3a0e; --badge-fg: #ffd88a; color-scheme: dark;
    --font: "Manrope", -apple-system, system-ui, sans-serif; --disp: "Barlow Condensed", "Arial Narrow", sans-serif; --disp-w: 800; --disp-tf: uppercase; --disp-ls: .01em;
    --r-card: 20px; --r-btn: 16px; --r-day: 14px;
    --btn: #e03a3a; --day-bg: #e03a3a; --chk: #e03a3a; --chk-fg: #ffffff; --tile: #17171a; --input: #09090a;
  }
  :root[data-theme="brutal"] {
    --bg: #1a0a0b; --fg: #f6ecec; --muted: #a48a8b; --card: #2a1214; --chip: #3a1b1e; --line: rgba(246,236,236,.14);
    --accent: #d02a2f; --on-accent: #ffffff; --link: #ff8a8a; --danger: #ff9a9a; --scrim: rgba(0,0,0,.65);
    --badge-bg: #4a3a0e; --badge-fg: #ffd88a; color-scheme: dark;
    --font: "Manrope", -apple-system, system-ui, sans-serif; --disp: "Barlow Condensed", "Arial Narrow", sans-serif; --disp-w: 800; --disp-tf: uppercase; --disp-ls: .02em;
    --r-card: 2px; --r-btn: 2px; --r-day: 2px;
    --btn: #d02a2f; --btn-clip: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    --day-bg: #d02a2f; --chk: #d02a2f; --chk-r: 2px; --excard: #241012; --tile: #241012; --input: #1a0a0b;
    --hero-bg: repeating-linear-gradient(135deg, #c42227 0 14px, #b81e23 14px 28px); --hero-pad: 14px; --hero-fg: #ffffff;
  }
  :root[data-theme="rose"] {
    --bg: #fbeff0; --fg: #2b1519; --muted: #8e6d73; --card: #fff7f7; --chip: #f3dcdf; --line: rgba(43,21,25,.12);
    --accent: #b5324f; --on-accent: #ffffff; --link: #a02a45; --danger: #a02a45;
    --font: "Manrope", -apple-system, system-ui, sans-serif; --disp: "Manrope", -apple-system, system-ui, sans-serif; --disp-w: 700; --disp-tf: none;
    --r-card: 22px; --r-btn: 999px; --r-day: 999px;
    --btn: #b5324f; --day-bg: #b5324f; --chk: #b5324f; --excard: #fff7f7; --tile: #f6dcdf; --input: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 var(--font);
    padding-block: 12px 96px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #app { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  h2 { margin: 22px 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-wrap: balance; }
  h2:first-child { margin-top: 8px; }

  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }
  .sub { font-size: 13px; color: var(--muted); }
  .b { font-weight: 700; }
  .warn { margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; background: var(--badge-bg); color: var(--badge-fg); font-size: 14px; }

  input, select {
    width: 100%; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid transparent; border-radius: 10px; padding: 0 12px; height: 48px;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field-l { display: block; margin: 0 0 4px 2px; font-size: 12px; color: var(--muted); }
  .vh { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .btn { width: 100%; min-height: 52px; margin-top: 10px; padding: 0 16px; border: 0; border-radius: 12px; font-weight: 600;
         display: flex; align-items: center; justify-content: center; gap: 8px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:disabled { opacity: .5; }
  .soft { background: var(--card); color: var(--link); }
  .outline { background: var(--bg); color: var(--link); border: 1px solid var(--accent); }
  .plain { background: var(--card); color: var(--fg); }
  .danger { background: none; color: var(--danger); border: 1px solid var(--danger); }

  .hdr { display: flex; align-items: center; gap: 4px; margin: -4px 0 8px -8px; }
  .back { flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--link); display: flex; align-items: center; justify-content: center; }
  .hdr-t { flex: 1; min-width: 0; }
  .h1 { font-size: 20px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
  .timer { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
           background: var(--accent); color: var(--on-accent); font-weight: 700; font-variant-numeric: tabular-nums; }

  .wcard { width: 100%; min-height: 84px; margin-bottom: 10px; padding: 14px 12px; border: 0; border-radius: 14px; text-align: left;
           background: var(--card); color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .wcard .t { font-size: 18px; font-weight: 700; }
  .wcard .x { font-size: 14px; color: var(--muted); }
  .wcard > svg { color: var(--muted); }
  .banner { width: 100%; margin-bottom: 4px; padding: 12px; border: 0; border-radius: 14px; text-align: left;
            background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 10px; }
  .banner .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .banner .tm { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  .thumb { flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 10px; overflow: hidden;
           background: var(--chip); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.dash { border: 1px dashed var(--muted); background: var(--bg); }
  .exrow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 8px; background: var(--card); border-radius: 14px; }
  .exrow .g { flex: 1; min-width: 0; }
  .exrow .n { font-weight: 600; overflow-wrap: anywhere; }
  .ico { flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; }

  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
  .scrim.zoom { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .85); padding: 16px; }
  .scrim.zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 88vh; overflow-y: auto;
           padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
           background: var(--bg); border-radius: 20px 20px 0 0; }
  .sheet-in { max-width: 560px; margin: 0 auto; }
  .grab { width: 40px; height: 5px; margin: 0 auto 10px; border-radius: 3px; background: var(--line); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link { flex: none; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--link); font-weight: 600; }

  .setrow { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
  .setrow .n { width: 20px; color: var(--muted); font-size: 14px; }
  .setrow .v { flex: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; margin-top: 8px; }
  .stepper { flex: 1; min-width: 0; }
  .ctl { display: flex; gap: 6px; }
  .ctl input { min-width: 0; padding: 0 2px; text-align: center; font-size: 20px; font-weight: 600; }
  .sbtn { flex: none; width: 44px; height: 48px; border: 0; border-radius: 10px; font-size: 22px; background: var(--bg); color: var(--fg); }
  .sbtn:active { opacity: .6; }
  .exclosed { width: 100%; min-height: 64px; margin-bottom: 10px; padding: 8px 12px 8px 8px; border: 0; border-radius: 14px; text-align: left;
              background: var(--card); color: var(--fg); display: flex; align-items: center; gap: 12px; }
  .exclosed > svg { color: var(--muted); }
  .prev { margin: 6px 2px 0; font-size: 13px; color: var(--muted); }

  .pick { width: 100%; min-height: 60px; margin-bottom: 8px; padding: 10px 12px; border: 0; border-radius: 14px; text-align: left;
          background: var(--card); color: var(--fg); display: flex; align-items: center; gap: 12px; }
  .pick.dim { opacity: .65; }
  .pick .g { flex: 1; min-width: 0; }

  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 4px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .hx { padding: 8px 0; border-top: 1px solid var(--line); }
  .hx-n { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; }
  .hx-s { margin-top: 2px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
           background: var(--badge-bg); color: var(--badge-fg); }
  .hs-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

  .periods { display: flex; gap: 6px; margin-top: 10px; }
  .periods button, .seg button { flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: 10px; padding: 0 2px; font-size: 13px; background: var(--card); color: var(--fg); }
  .seg { display: flex; gap: 6px; }
  .seg button { background: var(--bg); font-size: 12px; }
  .periods button.on, .seg button.on { background: var(--accent); color: var(--on-accent); }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; min-width: 0; }
  .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .selwrap { position: relative; margin: 8px 0 6px; }
  .selwrap select { appearance: none; -webkit-appearance: none; padding-right: 40px; height: 44px; }
  .selwrap svg { position: absolute; right: 12px; top: 13px; color: var(--muted); pointer-events: none; }
  canvas { display: block; width: 100%; height: 220px; touch-action: pan-y; }
  .illu { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px 24px; color: var(--muted); }
  .illu b { color: var(--fg); }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
          padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .tabs-in { display: flex; max-width: 560px; margin: 0 auto; }
  .tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; font-size: 12px; background: none; color: var(--muted);
                 display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tabs button.on { color: var(--link); font-weight: 600; }

  .opt { width: 100%; min-height: 56px; margin-bottom: 8px; padding: 8px 12px; border: 2px solid transparent; border-radius: 14px; text-align: left;
         background: var(--card); color: var(--fg); display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .opt.on { border-color: var(--accent); }
  .sw { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); }
  .hs { padding: 6px 0; }
  .hs input { width: auto; flex: 1; min-width: 0; height: 44px; padding: 0 4px; text-align: center; background: var(--bg); }
  .hs .u { color: var(--muted); }
  .readout { min-height: 24px; margin: 8px 2px 2px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- экран тренировки в новом стиле ---- */
  .kick { display: flex; align-items: center; gap: 4px; margin: -4px 0 6px -8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kick .back { width: 40px; height: 40px; }
  .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--hero-bg); padding: var(--hero-pad); color: var(--hero-fg); margin-bottom: 14px; }
  .hero-t { font-family: var(--disp); font-weight: var(--disp-w); text-transform: var(--disp-tf); letter-spacing: var(--disp-ls); font-size: 38px; line-height: .98; overflow-wrap: anywhere; text-wrap: balance; }
  .sq { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--card); color: var(--fg); display: flex; align-items: center; justify-content: center; }
  .hero .sq { background: var(--card); }
  .week { display: flex; gap: 6px; margin-bottom: 14px; }
  .wd { flex: 1; min-width: 0; padding: 8px 0 6px; border-radius: var(--r-day); background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .wd span { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .wd b { font-family: var(--disp); font-weight: var(--disp-w); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
  .wd i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .wd i.dot { background: var(--dot); }
  .wd.on { background: var(--day-bg); color: var(--day-fg); }
  .wd.on span { color: inherit; opacity: .8; }
  .wd.on i.dot { background: var(--day-fg); }
  .tiles { display: flex; gap: 8px; margin-bottom: 14px; }
  .tile { flex: 1; min-width: 0; padding: 10px 12px; border-radius: var(--r-card); background: var(--tile); }
  .tile small.l { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--disp); font-weight: var(--disp-w); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .v small { font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .excard { padding: 14px; margin-bottom: 10px; border-radius: var(--r-card); background: var(--excard); }
  .ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ex-name { font-family: var(--disp); font-weight: var(--disp-w); text-transform: var(--disp-tf); letter-spacing: var(--disp-ls); font-size: 26px; line-height: 1.05; overflow-wrap: anywhere; }
  .ex-prev { flex: none; text-align: right; font-size: 11px; color: var(--muted); }
  .ex-prev b { display: block; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .dashes { display: flex; gap: 4px; margin: 8px 0 10px; }
  .dashes i { flex: 1; max-width: 28px; height: 4px; border-radius: 2px; background: var(--chip); }
  .dashes i.f { background: var(--chk); }
  .dashes i.c { background: var(--accent); }
  .tr { display: grid; grid-template-columns: 24px 1fr 1fr 44px; align-items: center; gap: 8px; min-height: 52px; border-top: 1px solid var(--line); }
  .tr.th { min-height: 28px; border-top: 0; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tr .n { color: var(--muted); font-size: 13px; }
  .tr b { font-family: var(--disp); font-weight: var(--disp-w); font-size: 24px; font-variant-numeric: tabular-nums; }
  .tr input { height: 44px; padding: 0 8px; text-align: left; font-family: var(--disp); font-weight: var(--disp-w); font-size: 22px; background: var(--input); border: 1.5px solid var(--accent); border-radius: calc(var(--r-btn) * .6); min-width: 0; }
  .chk { width: 40px; height: 40px; padding: 0; border-radius: var(--chk-r); border: 2px solid var(--chk); background: transparent; color: var(--chk); display: flex; align-items: center; justify-content: center; }
  .chk.on { background: var(--chk); color: var(--chk-fg); }
  .nextex { width: 100%; margin-bottom: 8px; padding: 12px 14px; border: 0; border-radius: var(--r-card); text-align: left; background: var(--card); color: var(--fg); display: flex; align-items: center; gap: 10px; }
  .nextex .g { flex: 1; min-width: 0; }
  .nextex .nm { display: block; font-weight: 700; overflow-wrap: anywhere; }
  .nextex > svg { color: var(--muted); }
  .finish { width: 100%; min-height: 58px; margin-top: 12px; border: 0; border-radius: var(--r-btn); background: var(--btn); color: var(--btn-fg); clip-path: var(--btn-clip);
            font-family: var(--disp); font-weight: var(--disp-w); text-transform: var(--disp-tf); letter-spacing: .06em; font-size: 18px; }
  .h1 { font-family: var(--disp); text-transform: var(--disp-tf); }

  .sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }

  .wblock .wx { font-size: 13px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

  .rmex { width: 100%; min-height: 44px; margin-top: 10px; border: 0; background: none; color: var(--danger); font-weight: 600; }
  .periods.stick { position: sticky; top: 0; z-index: 5; margin: 0 -2px 6px; padding: 8px 2px; background: var(--bg); }
  .exnav { display: flex; gap: 6px; align-items: center; margin: 8px 0 6px; }
  .exnav .selwrap { flex: 1; min-width: 0; margin: 0; }
  .exnav > button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--bg); color: var(--link); display: flex; align-items: center; justify-content: center; }
  .bigv { display: flex; align-items: baseline; gap: 10px; margin: 6px 2px 0; }
  .bigv b { font-family: var(--disp); font-weight: var(--disp-w); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .bigv span { font-size: 14px; font-weight: 600; }
  .bigv .up { color: #1e8e3e; } .bigv .down { color: var(--danger); } .bigv .flat { color: var(--muted); }
  .dlg { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--scrim); }
  .dlg[hidden] { display: none; }
  .dlg-box { width: 100%; max-width: 340px; padding: 18px; border-radius: 16px; background: var(--bg); color: var(--fg); }
  .dlg-box p { margin: 0 0 16px; }
  .dlg-act { display: flex; gap: 8px; }
  .dlg-act button { flex: 1; min-height: 46px; border: 0; border-radius: 12px; font-weight: 600; background: var(--card); color: var(--fg); }
  .dlg-act button.ok { background: var(--accent); color: var(--on-accent); }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>
<div id="app"></div>
<input id="file" type="file" accept="image/*" hidden>
<nav class="tabs" aria-label="Разделы"><div class="tabs-in">
  <button data-tab="diary" class="on"></button>
  <button data-tab="kbzhu"></button>
  <button data-tab="settings"></button>
</div></nav>
<div id="dlg" class="dlg" hidden>
  <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlg-msg">
    <p id="dlg-msg"></p>
    <div class="dlg-act"><button id="dlg-no" type="button">Отмена</button><button id="dlg-ok" class="ok" type="button">Хорошо</button></div>
  </div>
</div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");

/* =====================================================================
   Данные. Всё хранится в памяти и сразу сохраняется в хранилище страницы
   (отдельно для каждого пользователя). Тут же вся логика расчётов.
   ===================================================================== */
const clone = o => JSON.parse(JSON.stringify(o));
const uid8 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const normName = s => { const t = s.trim().replace(/\s+/g, " "); return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase(); };
const cleanTitle = s => s.trim().replace(/\s+/g, " ").slice(0, 40);
const round1 = v => Math.round(v * 10) / 10;

const D = { workouts: [], bodyweight: [], sessions: [] };   // workouts: {id,name,exercises:[{name,photo}],archived}
                                                            // sessions: {id,workoutId,name,day,startedAt,finishedAt,exercises,sets:[{id,exercise,weight,reps}]}
const P = { mode: "loading" };
const KEY = "gym-diary-v1";
function persist() {
  if (P.mode !== "local") return;
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch (e) { note("Не удалось сохранить данные: память заполнена. Удали лишние фото."); }
}
const saveApp = persist;
const saveSession = persist;
const dropSession = persist;

/* ---- стартовые тренировки (один раз, только план без истории) ---- */
const SEED_WORKOUTS = [
  ["Грудь", ["Жим лежа", "Сведения рук в кроссовере", "Жим гантелей на наклонной скамье"]],
  ["Спина+бицепс", ["Подтягивания", "Тяга нижнего блока", "Тяга верхнего блока", "Бицепс в кроссовере", "Молотки"]],
  ["Плечи+трицепс", ["Жим гантелей", "Французский жим", "Махи гантелей", "Разгибания в кроссовере", "Шраги"]],
  ["Ноги", ["Присед", "Жим наклонной платформы", "Разгибания", "Сгибания", "Икроножные"]],
];
function seedData() {
  if (D.seed1) return;
  for (const [name, exs] of SEED_WORKOUTS) {
    if (!D.workouts.some(w => !w.archived && w.name === name))
      D.workouts.push({ id: uid8(), name, exercises: exs.map(n => ({ name: n, photo: null })), archived: false });
  }
  D.seed1 = true;
}

async function initStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); D.workouts = d.workouts || []; D.bodyweight = d.bodyweight || []; D.sessions = d.sessions || []; D.nutri = d.nutri || null; D.seed1 = !!d.seed1; }
    localStorage.setItem(KEY + "-t", "1"); localStorage.removeItem(KEY + "-t");
    P.mode = "local";
    seedData(); persist();
  } catch (e) { P.mode = "memory"; seedData(); }
}

/* ---- поиск по данным ---- */
const activeSession = () => D.sessions.filter(s => s.finishedAt == null).sort((a, b) => b.startedAt - a.startedAt)[0] || null;
const byStart = (a, b) => a.startedAt - b.startedAt;

function prevFor(name, excludeId) {
  const ss = D.sessions.filter(s => s.id !== excludeId && s.sets.some(x => x.exercise === name)).sort((a, b) => b.startedAt - a.startedAt)[0];
  if (!ss) return null;
  return { day: ss.day, sets: ss.sets.filter(x => x.exercise === name).map(x => ({ weight: x.weight, reps: x.reps })) };
}
function photoFor(name) {
  for (const w of [...D.workouts].reverse()) { const e = w.exercises.find(x => x.name === name && x.photo); if (e) return e.photo; }
  for (const s of [...D.sessions].sort((a, b) => b.startedAt - a.startedAt)) { const e = s.exercises.find(x => x.name === name && x.photo); if (e) return e.photo; }
  return null;
}
function dedupe(list) {
  const seen = new Set(), out = [];
  for (const e of list) {
    const n = normName(String(e.name || "")).slice(0, 60);
    if (!n || seen.has(n)) continue;
    seen.add(n); out.push({ name: n, photo: e.photo || null });
  }
  return out;
}
const setVol = x => x.weight * x.reps + (x.drops || []).reduce((a, d) => a + d.weight * d.reps, 0);
function bad(msg) { const e = new Error(msg); throw e; }

/* ---- тренировки-заготовки ---- */
function listWorkouts() {
  return D.workouts.filter(w => !w.archived).map(w => {
    const done = D.sessions.filter(s => s.workoutId === w.id && s.finishedAt != null).map(s => s.day).sort();
    return {
      id: w.id, name: w.name, last_day: done.length ? done[done.length - 1] : null,
      exercises: w.exercises.map(e => ({ name: e.name, photo: e.photo, prev: prevFor(e.name) })),
    };
  });
}
function createWorkout(body) {
  const n = D.workouts.filter(w => !w.archived).length;
  const w = { id: uid8(), name: cleanTitle(body.name || "") || `Тренировка ${n + 1}`, exercises: dedupe(body.exercises || []), archived: false };
  D.workouts.push(w); saveApp();
  return { id: w.id };
}
function updateWorkout(id, body) {
  const w = D.workouts.find(x => x.id === id && !x.archived);
  if (!w) bad("Тренировка не найдена");
  w.name = cleanTitle(body.name || "") || w.name;
  w.exercises = dedupe(body.exercises || []);
  saveApp();
  return { ok: true };
}
function deleteWorkout(id) {
  const w = D.workouts.find(x => x.id === id && !x.archived);
  if (!w) bad("Тренировка не найдена");
  w.archived = true; saveApp();
  return { ok: true };
}
function catalog() {
  const used = [], seen = new Set();
  for (const s of [...D.sessions].sort((a, b) => b.startedAt - a.startedAt))
    for (const x of [...s.sets].reverse()) if (!seen.has(x.exercise)) { seen.add(x.exercise); used.push(x.exercise); }
  const tmpl = [...new Set(D.workouts.flatMap(w => w.exercises.map(e => e.name)))].filter(n => !seen.has(n)).sort((a, b) => a.localeCompare(b, "ru"));
  return [...used, ...tmpl].map(n => ({ name: n, photo: photoFor(n), prev: prevFor(n) }));
}

/* ---- проведение тренировки ---- */
function sessionView(s) {
  return {
    id: s.id, workout_id: s.workoutId, name: s.name, day: s.day,
    started_at: Math.floor(s.startedAt / 1000), finished_at: s.finishedAt == null ? null : Math.floor(s.finishedAt / 1000),
    now: Math.floor(Date.now() / 1000),
    exercises: s.exercises.map(e => ({
      name: e.name, photo: e.photo,
      sets: s.sets.filter(x => x.exercise === e.name).map(x => ({ id: x.id, weight: x.weight, reps: x.reps, drops: x.drops || [] })),
      prev: prevFor(e.name, s.id),
    })),
  };
}
function activeById(id) {
  const s = D.sessions.find(x => x.id === id && x.finishedAt == null);
  if (!s) bad("Тренировка не найдена или уже завершена");
  return s;
}
function startSession(body) {
  if (activeSession()) bad("Уже идёт другая тренировка. Сначала заверши её.");
  const w = D.workouts.find(x => x.id === body.workout_id && !x.archived);
  if (!w) bad("Тренировка не найдена");
  const s = { id: uid8(), workoutId: w.id, name: w.name, day: body.day, startedAt: Date.now(), finishedAt: null,
              exercises: w.exercises.map(e => ({ name: e.name, photo: e.photo })), sets: [] };
  D.sessions.push(s); saveSession(s);
  return { id: s.id };
}
function ensureExercise(s, name, photo) {
  if (!s.exercises.some(e => e.name === name)) s.exercises.push({ name, photo: photo || photoFor(name) });
}
function addSessionExercise(sid, body) {
  const s = activeById(sid);
  const name = normName(String(body.name || "")).slice(0, 60);
  if (!name) bad("Укажи упражнение");
  ensureExercise(s, name, body.photo); saveSession(s);
  return { ok: true };
}
function removeSessionExercise(sid, body) {
  const s = activeById(sid);
  s.exercises = s.exercises.filter(e => e.name !== body.name);
  s.sets = s.sets.filter(x => x.exercise !== body.name);
  saveSession(s);
  return { ok: true };
}
function addSet(body) {
  const s = activeById(body.session_id);
  const name = normName(String(body.exercise || "")).slice(0, 60);
  if (!name) bad("Укажи упражнение");
  if (!(body.weight >= 0 && body.weight <= 1000)) bad("Проверь вес");
  if (!(Number.isInteger(body.reps) && body.reps >= 1 && body.reps <= 1000)) bad("Проверь повторы");
  ensureExercise(s, name);
  const drops = (body.drops || []).slice(0, 8);
  for (const d of drops) {
    if (!(d.weight >= 0 && d.weight <= 1000)) bad("Проверь вес в дроп-сете");
    if (!(Number.isInteger(d.reps) && d.reps >= 1 && d.reps <= 1000)) bad("Проверь повторы в дроп-сете");
  }
  const x = { id: uid8(), exercise: name, weight: body.weight, reps: body.reps };
  if (drops.length) x.drops = drops.map(d => ({ weight: d.weight, reps: d.reps }));
  s.sets.push(x); saveSession(s);
  return { id: x.id };
}
function deleteSet(id) {
  const s = D.sessions.find(x => x.finishedAt == null && x.sets.some(y => y.id === id));
  if (!s) bad("Подход не найден");
  s.sets = s.sets.filter(y => y.id !== id); saveSession(s);
  return { ok: true };
}
function finishSession(sid) {
  const s = activeById(sid);
  if (!s.sets.length) {
    D.sessions = D.sessions.filter(x => x.id !== sid); dropSession(sid);
    return { deleted: true };
  }
  s.finishedAt = Math.max(Date.now(), s.startedAt); saveSession(s);
  return { deleted: false, id: sid };
}

/* ---- история и рекорды ----
   Рекорд = лучше, чем во всех более ранних тренировках с этим упражнением; первый раз рекордом не считается.
   weight: рекордный вес. e1rm: новый расчётный максимум на 1 повтор (формула Эпли: вес * (1 + повторы / 30)).
   reps: рекорд повторов в упражнении без веса. */
function history() {
  const best = {}, out = [];
  for (const s of [...D.sessions].sort(byStart)) {
    const per = new Map();
    for (const x of s.sets) { if (!per.has(x.exercise)) per.set(x.exercise, []); per.get(x.exercise).push(x); }
    const listed = s.exercises.map(e => e.name);
    const names = [...listed.filter(n => per.has(n)), ...[...per.keys()].filter(n => !listed.includes(n))];
    let volume = 0, nSets = 0, nRec = 0;
    const exs = [];
    for (const n of names) {
      const ss = per.get(n);
      const topW = Math.max(...ss.map(x => x.weight));
      const topReps = Math.max(...ss.filter(x => x.weight === topW).map(x => x.reps));
      const e1 = Math.max(...ss.map(x => x.weight * (1 + x.reps / 30)));
      const maxReps = Math.max(...ss.map(x => x.reps));
      const prior = best[n];
      const rec = {
        weight: !!prior && topW > prior[0] + 1e-9,
        e1rm: !!prior && e1 > prior[1] + 1e-9,
        reps: !!prior && prior[0] === 0 && topW === 0 && maxReps > prior[2],
      };
      best[n] = prior ? [Math.max(prior[0], topW), Math.max(prior[1], e1), Math.max(prior[2], maxReps)] : [topW, e1, maxReps];
      volume += ss.reduce((a, x) => a + setVol(x), 0);
      nSets += ss.length;
      if (rec.weight || rec.e1rm || rec.reps) nRec++;
      exs.push({ name: n, sets: ss.map(x => ({ weight: x.weight, reps: x.reps, drops: x.drops || [] })), top: { weight: topW, reps: topReps }, e1rm: round1(e1), records: rec });
    }
    if (s.finishedAt != null) {
      out.push({
        id: s.id, name: s.name, day: s.day, imported: !!s.imported, started_at: Math.floor(s.startedAt / 1000),
        duration: Math.round((s.finishedAt - s.startedAt) / 1000), volume: round1(volume), sets: nSets, records: nRec, exercises: exs,
      });
    }
  }
  return out.reverse();
}

/* ---- прогресс ---- */
function progressFor(name, since) {
  const all = [];
  for (const s of D.sessions) for (const x of s.sets) if (x.exercise === name) all.push({ ...x, day: s.day, t: s.startedAt });
  all.sort((a, b) => a.t - b.t);
  let pr = null, bestE1 = 0;
  for (const x of all) {
    if (!pr || x.weight > pr.weight || (x.weight === pr.weight && x.reps > pr.reps)) pr = { weight: x.weight, reps: x.reps, day: x.day };
    bestE1 = Math.max(bestE1, x.weight * (1 + x.reps / 30));
  }
  const byDay = new Map();
  for (const x of all) {
    if (since && x.day < since) continue;
    const d = byDay.get(x.day) || { day: x.day, top_weight: 0, e1rm: 0, volume: 0, sets: 0 };
    d.top_weight = Math.max(d.top_weight, x.weight);
    d.e1rm = Math.max(d.e1rm, x.weight * (1 + x.reps / 30));
    d.volume += setVol(x); d.sets++;
    byDay.set(x.day, d);
  }
  const days = [...byDay.values()].sort((a, b) => (a.day < b.day ? -1 : 1)).map(d => ({ ...d, e1rm: round1(d.e1rm), volume: round1(d.volume) }));
  return { name, days, pr: pr && { ...pr, e1rm: round1(bestE1) } };
}
function summary(exercise, since) {
  const workouts = D.sessions.filter(s => s.finishedAt != null && (!since || s.day >= since)).length;
  const points = D.bodyweight.filter(p => !since || p.day >= since).sort((a, b) => (a.day < b.day ? -1 : 1)).map(p => ({ day: p.day, weight: p.weight }));
  const bw = { points, first: null, last: null, delta: null };
  if (points.length) {
    bw.first = points[0].weight; bw.last = points[points.length - 1].weight;
    if (points.length > 1) bw.delta = Math.round((bw.last - bw.first) * 100) / 100;
  }
  let ex = null;
  if (exercise) {
    const p = progressFor(normName(exercise), since);
    if (p.days.length) {
      const first = p.days[0].top_weight, last = p.days[p.days.length - 1].top_weight;
      ex = { name: p.name, days: p.days, first, last, delta: p.days.length > 1 ? Math.round((last - first) * 100) / 100 : null, pr: p.pr };
    }
  }
  return { since: since || null, workouts, bodyweight: bw, exercise: ex };
}
function saveBodyweight(body) {
  if (!(body.weight > 20 && body.weight < 500)) bad("Проверь вес");
  const p = D.bodyweight.find(x => x.day === body.day);
  if (p) p.weight = body.weight; else D.bodyweight.push({ day: body.day, weight: body.weight });
  saveApp();
  return { ok: true };
}

function deleteBodyweight(day) {
  D.bodyweight = D.bodyweight.filter(x => x.day !== day); saveApp();
  return { ok: true };
}

/* ---- маршрутизатор: интерфейс обращается к данным как к API ---- */
async function api(path, method = "GET", body) {
  const [p, qs] = path.split("?");
  const q = new URLSearchParams(qs || "");
  const m = method;
  let r;
  if (p === "/workouts" && m === "GET") return listWorkouts();
  if (p === "/workouts" && m === "POST") return createWorkout(body);
  if ((r = p.match(/^\/workouts\/([^/]+)$/))) {
    if (m === "PUT") return updateWorkout(r[1], body);
    if (m === "DELETE") return deleteWorkout(r[1]);
  }
  if (p === "/exercises") return catalog();
  if (p === "/sessions/active") { const s = activeSession(); return { session: s ? sessionView(s) : null }; }
  if (p === "/sessions" && m === "POST") return startSession(body);
  if ((r = p.match(/^\/sessions\/([^/]+)\/exercises\/remove$/))) return removeSessionExercise(r[1], body);
  if ((r = p.match(/^\/sessions\/([^/]+)\/exercises$/))) return addSessionExercise(r[1], body);
  if ((r = p.match(/^\/sessions\/([^/]+)\/finish$/))) return finishSession(r[1]);
  if (p === "/sets" && m === "POST") return addSet(body);
  if ((r = p.match(/^\/sets\/([^/]+)$/)) && m === "DELETE") return deleteSet(r[1]);
  if (p === "/history") return history();
  if (p === "/summary") return summary(q.get("exercise"), q.get("since"));
  if (p === "/bodyweight") return saveBodyweight(body);
  if ((r = p.match(/^\/bodyweight\/([^/]+)$/)) && m === "DELETE") return deleteBodyweight(r[1]);
  bad("Неизвестный запрос: " + p);
}

/* =====================================================================
   Интерфейс
   ===================================================================== */
const S = {
  tab: "diary", view: "list",      // внутри «Дневника»: list | edit | pick | session
  workouts: null, catalog: [], session: null, skew: 0,
  sheet: null, zoom: null, draft: null, pickFor: "draft", q: "", openEx: null, inputs: {}, photoIdx: null,

/* ---------- фото: уменьшаем и кладём в файловое хранилище страницы ---------- */
async function shrink(file, max = 640) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Не удалось открыть фото")); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok, no) => c.toBlob(b => (b ? ok(b) : no(new Error("Не удалось обработать фото"))), "image/jpeg", 0.7));
  } finally { URL.revokeObjectURL(url); }
}
$("#file").addEventListener("change", async e => {

  e.target.value = "";
  if (!f || S.photoIdx == null || !S.draft) return;
  const idx = S.photoIdx;
  try {
    const shrinkBlob = await shrink(f);
    const url = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(shrinkBlob); });
    if (S.draft && S.draft.exercises[idx]) { S.draft.exercises[idx].photo = url; render(); }
  } catch (err) { note("Не удалось загрузить фото. Попробуй ещё раз."); }
});

async function hChange(t) {
  const s = histSession();
  if (!s) return;
  const fail = async msg => { await note(msg); render(); };
  if (t.dataset.hs) {
    const x = s.sets.find(y => y.id === t.dataset.hs);
    if (!x) return;
    if (t.dataset.f === "w") { const v = parseNum(t.value); if (!(v >= 0 && v <= 1000)) return fail("Проверь вес"); x.weight = v; }
    else { const v = parseInt(t.value, 10); if (!(v >= 1 && v <= 1000)) return fail("Проверь повторы"); x.reps = v; }
    t.value = t.dataset.f === "w" ? fmtNum(x.weight) : x.reps;
  } else if (t.dataset.hd) {
    const [sid, j] = t.dataset.hd.split(":");
    const x = s.sets.find(y => y.id === sid), dr = x && x.drops && x.drops[+j];
    if (!dr) return;
    if (t.dataset.f === "w") { const v = parseNum(t.value); if (!(v >= 0 && v <= 1000)) return fail("Проверь вес"); dr.weight = v; }
    else { const v = parseInt(t.value, 10); if (!(v >= 1 && v <= 1000)) return fail("Проверь повторы"); dr.reps = v; }
    t.value = t.dataset.f === "w" ? fmtNum(dr.weight) : dr.reps;
  } else if (t.id === "hn") {
    s.name = cleanTitle(t.value) || s.name; t.value = s.name;
  } else if (t.id === "hd") {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.value);
    if (!m || t.value > today()) return fail("Проверь дату");
    const old = new Date(s.startedAt);
    const start = new Date(+m[1], +m[2] - 1, +m[3], old.getHours(), old.getMinutes()).getTime();
    s.finishedAt += start - s.startedAt; s.startedAt = start; s.day = t.value;
  } else if (t.id === "hm") {
    const v = parseInt(t.value, 10);
    if (!(v >= 1 && v <= 1440)) return fail("Проверь длительность");
    s.finishedAt = s.startedAt + v * 60000;
  } else return;
  saveSession(s);
}

  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Y(v);
    c.globalAlpha = 0.3; c.strokeStyle = hint;
    c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke();
    c.globalAlpha = 1; c.fillStyle = hint; c.fillText(axis(v), L - 6, y);
  }
  c.strokeStyle = accent; c.lineWidth = 2.5; c.lineJoin = "round";
  c.beginPath();
  pts.forEach((p, i) => (i ? c.lineTo(X(i), Y(p.y)) : c.moveTo(X(i), Y(p.y))));
  c.stroke();
  c.fillStyle = accent;
  pts.forEach((p, i) => { c.beginPath(); c.arc(X(i), Y(p.y), 3.5, 0, Math.PI * 2); c.fill(); });
  cv._hit = clientX => {
    const x = clientX - cv.getBoundingClientRect().left;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const dd = Math.abs(X(i) - x); if (dd < bd) { bd = dd; best = i; } });
    return best;
  };
  if (sel != null && pts[sel]) {
    const bg = cs.getPropertyValue("--bg").trim() || "#fff";
    c.save(); c.globalAlpha = 0.5; c.strokeStyle = hint; c.setLineDash([4, 4]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(X(sel), T); c.lineTo(X(sel), h - B); c.stroke(); c.restore();
    c.fillStyle = bg; c.beginPath(); c.arc(X(sel), Y(pts[sel].y), 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = accent; c.beginPath(); c.arc(X(sel), Y(pts[sel].y), 5, 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = hint; c.textBaseline = "alphabetic";
  c.textAlign = "left"; c.fillText(pts[0].x, L, h - 6);
  if (pts.length > 1) { c.textAlign = "right"; c.fillText(pts[pts.length - 1].x, w - R, h - 6); }
}

const offMap = p => {

  const j = await r.json();
  return j.status === 1 ? offMap({ ...j.product, code }) : null;

      const loop = async () => {
        if (!scanOn) return;
        try { const r = await det.detect(v); if (r.length) return gotCode(r[0].rawValue); } catch (e) {}
        setTimeout(loop, 250);
      };
      loop();
    } else {
      if (!window.ZXing) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const rd = new ZXing.BrowserMultiFormatReader();
      const loop = async () => {
        if (!scanOn) return;
        try { const r = await rd.decodeFromVideoElement(v); if (r) return gotCode(r.getText()); } catch (e) {}
        setTimeout(loop, 250);
      };
      loop();
    }

}
async function gotCode(code) {
  stopScan(); S.kvp.scan = false; S.kvp.msg = "";
  await lookup(code);
}
async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (code.length < 6) { S.kvp.msg = "Проверь штрихкод"; return render(); }
  let p = N().prods.find(x => x.code === code);
  if (!p) {
    S.kvp.msg = "Ищу в базе…"; render();
    try { const o = await offByCode(code); if (o) p = keepProd(o); } catch (e) { S.kvp.msg = "Нет связи с базой продуктов."; return render(); }
  }
  if (!p) { S.kvp.msg = `Штрихкод ${code} не найден. Добавь продукт вручную, он запомнится.`; S.kvp.manual = true; S.kvp.code = code; return render(); }
  S.kvp.msg = ""; S.kvp.sel = p; render();
}

/* ---- Советы: вес, недельная сводка ---- */
const GOALS = { gain: "Набор массы", cut: "Сушка", keep: "Поддержание" };
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
function weekReport() {
  const end = today(), s1 = addDays(end, -6), s0 = addDays(end, -13);
  const inR = (d, a, b) => d >= a && d <= b;
  const wCur = D.bodyweight.filter(p => inR(p.day, s1, end)).sort((a, b) => a.day < b.day ? -1 : 1);
  const wPrev = D.bodyweight.filter(p => inR(p.day, s0, addDays(s1, -1)));
  let dW = null;
  if (wCur.length && wPrev.length) dW = avg(wCur.map(p => p.weight)) - avg(wPrev.map(p => p.weight));
  else if (wCur.length > 1) dW = wCur[wCur.length - 1].weight - wCur[0].weight;
  const days = {}; N().log.filter(x => inR(x.day, s1, end)).forEach(x => days[x.day] = (days[x.day] || 0) + x.k);
  const dk = Object.values(days), kcal = avg(dk), P = sumM(N().log.filter(x => inR(x.day, s1, end)));
  const best = (a, b) => { const m = {}; D.sessions.filter(s => s.finishedAt != null && inR(s.day, a, b)).forEach(s => s.sets.forEach(x => { if (x.weight > 0) m[x.exercise] = Math.max(m[x.exercise] || 0, x.weight * (1 + x.reps / 30)); })); return m; };
  const cur = best(s1, end), base = best(addDays(s1, -35), addDays(s1, -1)), ch = [];
  for (const n in cur) if (base[n]) ch.push({ n, pct: (cur[n] / base[n] - 1) * 100 });
  const str = ch.length ? { pct: avg(ch.map(x => x.pct)), up: ch.filter(x => x.pct > 1).length, down: ch.filter(x => x.pct < -1).length, n: ch.length } : null;
  const trainings = D.sessions.filter(s => s.finishedAt != null && inR(s.day, s1, end)).length;
  const bw = wCur.length ? wCur[wCur.length - 1].weight : (D.bodyweight.slice().sort((a, b) => a.day < b.day ? 1 : -1)[0] || {}).weight;
  return { s1, end, dW, kcal, kd: dk.length, protein: dk.length ? P.b / dk.length : null, str, trainings, bw };
}
function advice(r) {
  const goal = N().goal, out = [];
  if (r.dW == null || r.kd < 3) {
    out.push(["Для точного совета нужно минимум 3 дня записей еды за неделю и 2 взвешивания (или вес за прошлую неделю).", "w"]);
    return out;
  }
  const dW = r.dW, sp = r.str ? r.str.pct : null, strUp = sp != null && sp > 1, strDown = sp != null && sp < -1;
  const strTxt = sp == null ? "Силовые пока не с чем сравнить: запиши тренировки с тем же упражнением." : strUp ? `Силовые растут (в среднем ${fmtDelta(r1(sp))}%).` : strDown ? `Силовые падают (в среднем ${fmtDelta(r1(sp))}%).` : "Силовые без изменений.";
  const rate = r.bw ? dW / r.bw * 100 : 0;
  if (goal === "gain") {
    if (dW <= 0.1) out.push([strUp ? `Вес почти стоит на месте (${fmtDelta(r1(dW))} кг), но силовые растут: возможно, идёт набор качества. Если хочешь расти в весе, добавь 150–250 ккал.` : `Вес не растёт (${fmtDelta(r1(dW))} кг)${sp == null ? "" : " и силовые не растут"}. Добавь 250–300 ккал в день и следи за прогрессией нагрузок.`, "a"]);
    else if (rate > 0.75 || dW > 0.75) out.push([strUp ? `Набор быстрый (${fmtDelta(r1(dW))} кг за неделю), хотя силовые растут. Часть прибавки, вероятно, жир: убери 150–250 ккал, чтобы набирать 0,25–0,5 кг в неделю.` : `Набираешь быстро (${fmtDelta(r1(dW))} кг), а силовые не растут. Это в основном жир: убавь 300–400 ккал в день.`, "a"]);
    else out.push([strUp ? `Отличный темп: ${fmtDelta(r1(dW))} кг и рост силовых. Ничего не меняй.` : `Темп набора хороший (${fmtDelta(r1(dW))} кг), но силовые не растут. Калорий хватает; проверь сон, восстановление и прогрессию весов.`, "g"]);
  } else if (goal === "cut") {
    if (dW > 0.1) out.push([`Вес растёт (${fmtDelta(r1(dW))} кг) при цели сушки. Убери 250–350 ккал в день или добавь шаги и кардио.`, "a"]);
    else if (dW > -0.2) out.push([`Вес почти не снижается (${fmtDelta(r1(dW))} кг). Убери ещё 150–250 ккал.${strDown ? " Силовые падают, так что лучше добавить шаги, чем резать еду." : ""}`, "a"]);
    else if (rate < -1 || dW < -1) out.push([strDown ? `Вес падает слишком быстро (${fmtDelta(r1(dW))} кг) и силовые снижаются: теряешь мышцы. Добавь 250–300 ккал.` : `Вес падает быстро (${fmtDelta(r1(dW))} кг). Силовые держатся, но безопаснее терять до 0,5–0,75 кг в неделю, добавь 150–200 ккал.`, "a"]);
    else out.push([strDown ? `Темп ${fmtDelta(r1(dW))} кг хороший, но силовые падают. Добавь 100–150 ккал и проверь белок и сон.` : `Хороший темп сушки: ${fmtDelta(r1(dW))} кг, силовые держатся. Продолжай.`, "g"]);
  } else {
    if (Math.abs(dW) <= 0.3) out.push([`Вес стабилен (${fmtDelta(r1(dW))} кг). Калорийность подходит.`, "g"]);
    else if (dW > 0) out.push([`Вес растёт (${fmtDelta(r1(dW))} кг). Для поддержания убери около 200 ккал.${strUp ? " Силовые растут, возможно, это мышцы, если это не мешает." : ""}`, "a"]);
    else out.push([`Вес снижается (${fmtDelta(r1(dW))} кг). Для поддержания добавь около 200 ккал.`, "a"]);
  }
  out.push([strTxt, ""]);
  if (r.protein != null && r.bw && r.protein < r.bw * 1.4) out.push([`Белка в среднем ${Math.round(r.protein)} г в день. Для тренирующегося обычно хватает 1,6–2 г на кг веса (около ${Math.round(r.bw * 1.6)}–${Math.round(r.bw * 2)} г).`, "w"]);
  if (r.kcal) { const tdee = r.kcal - dW * 7700 / 7; out.push([`Оценка твоей поддерживающей калорийности: около ${Math.round(tdee / 10) * 10} ккал в день (по средним ${Math.round(r.kcal)} ккал и изменению веса).`, ""]); }
  return out;
}

  "kv-add": () => {

    kvAddEntry(S.kvp.sel, g); stopScan(); S.kvp = null; render();

  "kv-scan": async () => { S.kvp.scan = true; S.kvp.msg = ""; render(); startScan(); },

  "kv-online": async () => {
    const q = ($("#kv-q") || {}).value || ""; if (q.trim().length < 2) return note("Введи название для поиска");
    S.kvp.q = q; S.kvp.msg = "Ищу…"; render();
    try { S.kvp.online = await offSearch(q); S.kvp.msg = S.kvp.online.length ? "" : "В базе ничего не нашлось."; } catch (e) { S.kvp.msg = "Нет связи с базой продуктов."; }
    render();
  },
  "kv-manual": () => { S.kvp.manual = true; S.kvp.msg = ""; render(); },
  "kv-manual-ok": () => {
    const name = cleanTitle(($("#kv-mn") || {}).value || ""), v = ["k", "b", "j", "u"].map(x => num("kv-m" + x) || 0);
    if (!name || !(v[0] >= 0)) return note("Укажи название и калории");
    S.kvp.sel = keepProd({ name, k: v[0], b: v[1], j: v[2], u: v[3], code: S.kvp.code || "" }); S.kvp.manual = false; render();
  },
  "kv-rm": b => { S.calc.rows.splice(+b.dataset.i, 1); render(); },
  "kv-calc-reset": async () => { if (await ask("Очистить блюдо?")) { S.calc = { name: "", rows: [], cooked: "", portion: "" }; render(); } },
  "kv-calc-save": async () => {
    const c = S.calc, ck = parseNum(c.cooked);
    if (!c.name.trim()) return note("Введи название блюда");
    if (!(ck > 0)) return note("Введи вес готового блюда");
    const p = per100(calcTotals().tot, ck);
    N().prods.push({ id: uid8(), name: cleanTitle(c.name), k: r1(p.k), b: r1(p.b), j: r1(p.j), u: r1(p.u), code: "" }); persist();
    note("Блюдо сохранено как продукт (на 100 г готового). Теперь его можно выбрать в дневнике.");
  },
  "kv-calc-log": () => {
    const c = S.calc, ck = parseNum(c.cooked), por = parseNum(c.portion);
    if (!(ck > 0 && por > 0)) return note("Введи вес готового блюда и свою порцию");
    const m = mac(per100(calcTotals().tot, ck), por);
    N().log.push({ id: uid8(), day: today(), name: cleanTitle(c.name) || "Блюдо", g: por, ...m }); persist();
    S.kvDay = today(); S.kv = "log"; render();
  },
  "kv-day": b => { S.kvDay = addDays(S.kvDay || today(), +b.dataset.d); render(); },
  "kv-del": b => { N().log = N().log.filter(x => x.id !== b.dataset.id); persist(); render(); },
  "kv-goal": b => { N().goal = b.dataset.g; persist(); render(); },
  "kv-w-save": async () => {
    const w = num("kv-w"); if (!(w > 20 && w < 500)) return note("Проверь вес");
    try { await api("/bodyweight", "POST", { weight: w, day: today() }); } catch (e) { return note(e.message); }
    render();
  },
  "kv-w-del": async b => { await api("/bodyweight/" + b.dataset.day, "DELETE"); render(); },
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "kv-q" && S.kvp) { S.kvp.q = t.value; $("#kv-list").innerHTML = pickList(); }
  else if (t.id === "kv-dn") S.calc.name = t.value;
  else if (t.id === "kv-cooked" || t.id === "kv-portion") { S.calc[t.id === "kv-cooked" ? "cooked" : "portion"] = t.value; $("#kv-res").innerHTML = calcRes(); }
  else if (t.id === "kv-g" && S.kvp && S.kvp.sel) { const g = parseNum(t.value); $("#kv-gr").textContent = g > 0 ? macTxt(mac(S.kvp.sel, g)) : ""; }
  else if (t.id === "kv-kg") { N().kcalGoal = Math.max(0, parseInt(t.value, 10) || 0); persist(); }
});

/* ---------- Telegram ---------- */
try {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
  }
} catch (e) {}

/* ---------- старт ---------- */
(async () => {
  render();
  await initStore();
  try {
    await Promise.all([loadWorkouts(), loadSession(), loadCatalog()]);
    if (S.session) S.view = "session";   // тренировка идёт: открываем её сразу
  } catch (e) { S.workouts = S.workouts || []; }
  render();
})();
</script>
</body>
